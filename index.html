<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעבר לדף הכלים</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center space-y-6">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
            🔗
        </div>
        <h1 class="text-2xl font-bold text-slate-800">הדף עבר לכתובת חדשה</h1>
        <p class="text-slate-600 text-sm">
            הדפדפן אמור להעביר אתכם אוטומטית בעוד מספר רגעים. אם ההעברה אינה מתבצעת, אנא לחצו על הכפתור שלהלן.
        </p>
        
        <a href="https://openmusictools.github.io/chord-lab/" 
           class="inline-block w-full py-3 px-6 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow-md transition-all duration-200">
            מעבר ידני לכלי
        </a>
    </div>

    <script>
        // Automatic redirect after a short delay
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                window.location.href = "https://openmusictools.github.io/chord-lab/";
            }, 1000);
        });
    </script>
</body>
</html>
